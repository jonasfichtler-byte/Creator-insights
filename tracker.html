<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b10">
<title>Creator Tracker</title>
<style>
:root{--bg:#f4f4f8;--card:#fff;--card2:#eeeef4;--tx:#14141a;--mu:#6e6e7c;--bd:#e4e4ec;--ac:#fe2c55;--ac2:#20d5ec;--ok:#12a36b;--glow:rgba(254,44,85,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b10;--card:#15151c;--card2:#1d1d27;--tx:#f4f4f8;--mu:#8f8fa0;--bd:#25252f;--glow:rgba(254,44,85,.22)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(96px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:20px;margin:0;letter-spacing:-.3px}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mu);background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.dot.on{background:#25d366;box-shadow:0 0 0 0 rgba(37,211,102,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 7px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(145deg,var(--card),var(--card2));position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(var(--glow),transparent 70%)}
.k{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:4px 0}
.v{font-size:22px;font-weight:700;letter-spacing:-.5px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(18,163,107,.15);color:var(--ok)}
.chip.neg{background:rgba(254,44,85,.15);color:var(--ac)}
.sub{color:var(--mu);font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.grid3 .card{margin:0;padding:13px;text-align:left}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid2 .card{margin:0}
.bar{height:10px;background:var(--card2);border-radius:8px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:8px;transition:width .8s}
.sec{font-size:13px;color:var(--mu);font-weight:700;margin:20px 4px 8px;text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0;padding-bottom:0}.row:first-child{padding-top:0}
.row .t{min-width:0;flex:1}.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mu)}
.th{width:46px;height:62px;border-radius:10px;object-fit:cover;background:var(--card2);flex:none}
.th.big{width:64px;height:86px}
.rank{width:26px;height:26px;border-radius:8px;background:var(--card2);color:var(--mu);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.rank.g{background:var(--ac);color:#fff}
.vbar{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--ac2),var(--ac));margin-top:5px}
.pills{display:flex;gap:8px;margin-bottom:12px}
.pills button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:12px;font:inherit;font-size:13px;font-weight:600}
.pills button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin-top:5px}
label{font-size:12px;color:var(--mu);display:block;margin-top:10px;font-weight:600}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--ac),#ff5a7a);color:#fff;font:inherit;font-weight:700}
.btn.ghost{background:var(--card2);color:var(--tx)}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:4px 8px}
.empty{color:var(--mu);font-size:14px;text-align:center;padding:14px 0}
svg{width:100%;height:auto;display:block;overflow:visible}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px;line-height:1;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--ac)}nav button.on span{filter:none;opacity:1}
.fade{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
#foot{text-align:center;color:var(--mu);font-size:12px;margin-top:16px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:f .2s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.hm{display:grid;grid-template-columns:34px repeat(6,1fr);gap:4px;align-items:center}
.hm i{font-style:normal;font-size:11px;color:var(--mu);text-align:center}
.hm b{display:flex;align-items:center;justify-content:center;height:34px;border-radius:8px;font-size:10px;font-weight:700;color:#fff}
.hm b.e{background:var(--card2)}
.cmpbar{height:8px;background:var(--card2);border-radius:6px;position:relative;margin:8px 0 4px}
.cmpbar i{position:absolute;top:-3px;width:3px;height:14px;background:var(--tx);border-radius:2px}
.cmpbar u{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--ac2),var(--ac));text-decoration:none}
</style></head><body><main>
<header><h1>📈 Creator Tracker</h1><div class="live" id="live" onclick="loadLive()"><i class="dot" id="dot"></i><span id="lt">lädt…</span></div></header>
<div id="app" class="fade"></div>
<p id="foot">Einnahmen & Ziele werden nur in diesem Browser gespeichert.</p>
</main>
<nav><div id="nav"></div></nav>
<script>
var API='https://creator-tracker-api.jonas-fichtler.workers.dev',tab='home',live=null,hist=[],liveErr='',items=[],sort='top',range=ls('ct_range',7),showForm=false,LS='ct_items';
var eur=function(n){return n.toLocaleString('de-DE',{style:'currency',currency:'EUR'})};
var num=function(n){return Math.round(n).toLocaleString('de-DE')};
var cmp=function(n){n=+n||0;if(n>=1e6)return (n/1e6).toFixed(n>=1e7?1:2).replace('.',',')+'M';if(n>=1e4)return (n/1e3).toFixed(1).replace('.',',')+'K';return num(n)};
var today=function(){return new Date().toISOString().slice(0,10)};
function img(u,c){return u?'<img class="th '+(c||'')+'" src="'+esc(u)+'" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display=\'none\'">':''}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function ms(c){c=+c||0;return c<1e12?c*1000:c}
function ls(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
items=ls(LS,[]);
function save(){lsSet(LS,items)}
function go(t){tab=t;showForm=false;render();window.scrollTo(0,0)}

async function loadLive(){
  document.getElementById('lt').textContent='aktualisiere…';
  try{
    var r=await fetch(API+'/api/stats'),j=await r.json();
    if(j.error)throw new Error(j.error);live=j;liveErr='';
    try{hist=await (await fetch(API+'/api/history')).json()}catch(e){}
  }catch(e){liveErr=String(e.message||e).slice(0,100)}
  render();
}
setInterval(loadLive,60000);

function spark(vals,h){
  h=h||60;if(vals.length<2)return '<div class="sub" style="padding:8px 0">Verlauf erscheint nach ein paar Messungen (alle 30 Min.).</div>';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),r=(mx-mn)||1,W=300,
  P=vals.map(function(v,i){return [i*W/(vals.length-1),h-4-(v-mn)/r*(h-12)]}),
  d=P.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
  return '<svg viewBox="0 0 '+W+' '+h+'" preserveAspectRatio="none" style="height:'+h+'px"><defs><linearGradient id="g'+h+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fe2c55" stop-opacity=".35"/><stop offset="1" stop-color="#fe2c55" stop-opacity="0"/></linearGradient></defs>'+
   '<path d="'+d+' L'+W+' '+h+' L0 '+h+'Z" fill="url(#g'+h+')"/><path d="'+d+'" fill="none" stroke="#fe2c55" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}
function bars(d,hl){
  var m=Math.max.apply(null,d.map(function(x){return x.v}).concat([1])),n=d.length,w=300/n,s='<svg viewBox="0 0 300 130">';
  d.forEach(function(x,i){var h=x.v/m*80,c=(hl!=null&&hl===i)?'#fe2c55':'#3a3a4c';
    s+='<rect x="'+(i*w+w*.18)+'" y="'+(100-h)+'" width="'+(w*.64)+'" height="'+Math.max(h,2)+'" rx="5" fill="'+(hl==null?'#fe2c55':c)+'" opacity="'+(x.v?1:.35)+'"/>'+
    '<text x="'+(i*w+w/2)+'" y="118" text-anchor="middle" font-size="11" fill="#8f8fa0">'+x.l+'</text>'+
    (x.v?'<text x="'+(i*w+w/2)+'" y="'+(94-h)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#8f8fa0">'+x.t+'</text>':'')});
  return s+'</svg>';
}

function goalHTML(){
  var g=ls('ct_goal',0),f=live?live.follower:null;
  if(!g||f===null)return '<div class="card"><div class="k">🎯 Follower-Ziel</div><label>Ziel eingeben (z. B. 20000)</label><input type="number" inputmode="numeric" placeholder="20000" onchange="lsSet(\'ct_goal\',+this.value);render()"></div>';
  var p=Math.min(100,f/g*100),rest=Math.max(0,g-f),pr='';
  if(rest===0)pr='<span class="chip">Ziel erreicht 🎉</span>';
  else if(hist.length>1){var a=hist[0],b=hist[hist.length-1],dd=(b.t-a.t)/864e5,rate=dd>0.2?(b.follower-a.follower)/dd:0;
    pr=rate>0?'Ø +'+num(rate)+'/Tag → ca. <b>'+new Date(Date.now()+rest/rate*864e5).toLocaleDateString('de-DE')+'</b>':'Prognose folgt'}
  else pr='Prognose folgt nach ein paar Stunden';
  return '<div class="card"><div style="display:flex;justify-content:space-between"><div class="k">🎯 Follower-Ziel</div><div class="k">'+p.toFixed(1)+' %</div></div>'+
    '<div class="v" style="margin-top:4px">'+num(f)+' <span class="sub" style="font-weight:500">/ '+num(g)+'</span></div><div class="bar"><i style="width:'+p.toFixed(1)+'%"></i></div>'+
    '<div class="sub">Noch '+num(rest)+' · '+pr+'</div>'+
    '<div style="margin-top:10px"><a href="#" style="color:var(--mu);font-size:12px" onclick="var v=prompt(\'Neues Follower-Ziel:\',\''+g+'\');if(v){lsSet(\'ct_goal\',+v);render()}return false">Ziel ändern</a></div></div>';
}

function stats(){
  var A=(live&&live.list||[]).filter(function(v){return v.created}),L=A.filter(inR),wk=Date.now()-7*864e5,
  week=A.filter(function(v){return ms(v.created)>=wk}).sort(function(a,b){return b.views-a.views}),
  dv=[0,0,0,0,0,0,0],dc=[0,0,0,0,0,0,0],hv={},hc={};
  L.forEach(function(v){var d=new Date(ms(v.created));dv[d.getDay()]+=v.views;dc[d.getDay()]++;hv[d.getHours()]=(hv[d.getHours()]||0)+v.views;hc[d.getHours()]=(hc[d.getHours()]||0)+1});
  return {L:L,week:week,dv:dv,dc:dc,hv:hv,hc:hc};
}
function bestVideoHTML(S){
  var h='<div class="card"><div class="k">🏆 Bestes Video der Woche</div>';
  if(S.week.length){var b=S.week[0];h+='<div style="display:flex;gap:12px;margin-top:8px">'+img(b.cover,'big')+'<div style="min-width:0"><div class="v">'+num(b.views)+' Views</div><div style="margin:2px 0 4px">'+esc(b.title||'(ohne Titel)')+'</div><div class="sub">'+num(b.likes)+' Likes · '+new Date(ms(b.created)).toLocaleDateString('de-DE')+' · '+S.week.length+' Videos in 7 Tagen</div></div></div>'}
  else h+='<div class="empty">Diese Woche noch kein Video gepostet.</div>';
  return h+'</div>';
}

function incData(){
  var inc=items.filter(function(i){return i.t==='inc'}).sort(function(a,b){return a.date<b.date?1:-1}),now=new Date(),ym=now.toISOString().slice(0,7);
  return {inc:inc,month:inc.filter(function(i){return i.date.slice(0,7)===ym}).reduce(function(s,i){return s+i.amt},0),tot:inc.reduce(function(s,i){return s+i.amt},0),now:now};
}

var sel=null;
function openV(id){sel=id;render()}
function closeV(){sel=null;render()}
function median(a){a=a.slice().sort(function(x,y){return x-y});var m=a.length>>1;return a.length?(a.length%2?a[m]:(a[m-1]+a[m])/2):0}
function sheetHTML(){
  if(!sel||!live)return '';
  var L=live.list,v=L.filter(function(x){return x.id===sel})[0];if(!v)return '';
  var med=median(L.map(function(x){return x.views})),avg=L.reduce(function(s,x){return s+x.views},0)/L.length,
      er=v.views?v.likes/v.views*100:0,aer=L.reduce(function(s,x){return s+(x.views?x.likes/x.views:0)},0)/L.length*100,
      x=med?v.views/med:0,rank=L.filter(function(y){return y.views>v.views}).length+1,mx=Math.max.apply(null,L.map(function(y){return y.views})),
      verdict=x>=2?['🔥 Hit',''] :x>=1.1?['👍 Über Schnitt',''] :x>=0.8?['😐 Normal','neg0']:['📉 Unter Schnitt','neg'];
  return '<div class="sheetbg" onclick="closeV()"><div class="sheet" onclick="event.stopPropagation()">'+
   '<div style="display:flex;gap:14px">'+img(v.cover,'big')+'<div style="min-width:0"><span class="chip '+verdict[1]+'">'+verdict[0]+'</span><div style="margin:8px 0 4px;font-weight:600">'+esc(v.title||'(ohne Titel)')+'</div><div class="sub">'+(v.created?new Date(ms(v.created)).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' · '+new Date(ms(v.created)).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr':'')+'</div></div></div>'+
   '<div class="grid3" style="margin:16px 0 8px"><div class="card"><div class="k">Views</div><div class="v">'+num(v.views)+'</div></div><div class="card"><div class="k">Likes</div><div class="v">'+num(v.likes)+'</div></div><div class="card"><div class="k">Rang</div><div class="v">#'+rank+'</div></div></div>'+
   '<div class="card" style="margin-bottom:10px"><div class="k">Views im Vergleich</div><div style="margin-top:6px"><span class="v">'+x.toFixed(1).replace('.',',')+'×</span> <span class="sub">dein Median ('+num(med)+')</span></div>'+
   '<div class="cmpbar"><u style="width:'+Math.max(2,v.views/mx*100)+'%"></u><i style="left:'+(med/mx*100)+'%"></i></div><div class="sub">Strich = Median · Ø '+num(avg)+' · Bestes Video '+num(mx)+'</div></div>'+
   '<div class="card" style="margin-bottom:10px"><div class="k">Likes pro View</div><div style="margin-top:6px"><span class="v">'+er.toFixed(1).replace('.',',')+' %</span> <span class="sub">dein Ø '+aer.toFixed(1).replace('.',',')+' %</span></div><div class="sub">'+(er>aer*1.1?'Das Video kommt besser an als sonst.':er<aer*0.9?'Weniger Likes als sonst im Verhältnis zu den Views.':'So wie sonst auch.')+'</div></div>'+
   '<button class="btn ghost" onclick="closeV()">Schließen</button></div></div>';
}
function heatmap(S){
  var B=[[0,4],[4,8],[8,12],[12,16],[16,20],[20,24]],DN=['Mo','Di','Mi','Do','Fr','Sa','So'],ord=[1,2,3,4,5,6,0],cell={},mx=0;
  S.L.forEach(function(v){var d=new Date(ms(v.created)),w=d.getDay(),b=Math.floor(d.getHours()/4),k=w+'_'+b;cell[k]=cell[k]||{s:0,n:0};cell[k].s+=v.views;cell[k].n++});
  Object.keys(cell).forEach(function(k){cell[k].a=cell[k].s/cell[k].n;if(cell[k].n>=2&&cell[k].a>mx)mx=cell[k].a});
  var h='<div class="hm"><i></i>'+B.map(function(b){return '<i>'+b[0]+'–'+b[1]+'</i>'}).join('');
  ord.forEach(function(w,r){h+='<i style="text-align:left">'+DN[r]+'</i>';
    for(var b=0;b<6;b++){var c=cell[w+'_'+b];
      if(!c)h+='<b class="e"></b>';
      else{var q=mx?Math.min(1,c.a/mx):0,al=c.n>=2?(.25+.75*q):.12;h+='<b style="background:rgba(254,44,85,'+al.toFixed(2)+');'+(c.n<2?'color:var(--mu)':'')+'">'+cmp(c.a)+'</b>'}}});
  return h+'</div><div class="sub" style="margin-top:10px">Ø Views pro Video. Dunkler = besser. Blasse Felder: nur 1 Video, wenig Aussagekraft. Uhrzeiten in Blöcken von 4 Stunden.</div>';
}
function setRange(d){range=d;lsSet('ct_range',d);render()}
function cutoff(){return range?Date.now()-range*864e5:0}
function inR(v){return !range||ms(v.created)>=cutoff()}
function pillsHTML(){return '<div class="pills">'+[[1,'24 Std.'],[7,'7 Tage'],[30,'30 Tage'],[0,'Alles']].map(function(r){return '<button class="'+(range===r[0]?'on':'')+'" onclick="setRange('+r[0]+')">'+r[1]+'</button>'}).join('')+'</div>'}
function rangeCard(){
  if(!live)return '';
  var R=live.list.filter(inR),vw=R.reduce(function(s,v){return s+v.views},0),lk=R.reduce(function(s,v){return s+v.likes},0),
      H=hist.filter(function(x){return x.t>=cutoff()}),h='<div class="card"><div class="k">📊 '+(range?'Letzte '+(range===1?'24 Stunden':range+' Tage'):'Gesamt')+'</div>';
  h+='<div class="grid2" style="margin:10px 0 0"><div><div class="v">'+num(R.length)+'</div><div class="sub">Neue Videos</div></div><div><div class="v">'+cmp(vw)+'</div><div class="sub">Views dieser Videos</div></div>'+
     '<div><div class="v">'+cmp(lk)+'</div><div class="sub">Likes dieser Videos</div></div><div><div class="v">'+(R.length?cmp(vw/R.length):'–')+'</div><div class="sub">Ø Views pro Video</div></div></div>';
  if(range){
    if(H.length>=2){var a=H[0],b=H[H.length-1],fg=b.follower-a.follower,vg=b.views-a.views,short=a.t>cutoff()+36e5*2;
      h+='<div class="row" style="margin-top:12px"><div class="t"><div>Follower-Zuwachs</div></div><b class="'+(fg<0?'neg':'pos')+'" style="color:'+(fg<0?'var(--ac)':'var(--ok)')+'">'+(fg>=0?'+':'')+num(fg)+'</b></div>'+
         '<div class="row"><div class="t"><div>Views gesamt dazu (alle Videos)</div></div><b>+'+num(vg)+'</b></div>'+
         (short?'<div class="sub" style="margin-top:8px">Verlauf wird erst seit '+new Date(a.t).toLocaleString('de-DE',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})+' gespeichert, der Zeitraum ist daher kürzer.</div>':'')}
    else h+='<div class="sub" style="margin-top:10px">Follower-Zuwachs folgt, sobald genug Messungen da sind.</div>';
  }
  return h+'</div>';
}
function render(){
  var N=[['home','🏠','Start'],['vid','🎬','Videos'],['ins','💡','Insights'],['inc','💶','Geld']];
  document.getElementById('nav').innerHTML=N.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
  document.getElementById('dot').className='dot'+(live?' on':'');
  document.getElementById('lt').textContent=live?'Live · '+new Date(live.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):(liveErr?'Fehler – tippen':'lädt…');
  var D=incData(),S=stats(),h='';
  if(tab==='home'){
    var f=live?live.follower:null,dl=null;
    if(f!==null&&hist.length>1){var ref=hist[0];for(var i=0;i<hist.length;i++){if(hist[i].t>=Date.now()-864e5){ref=hist[Math.max(0,i-1)];break}}dl=f-ref.follower}
    h+='<div class="card hero"><div class="k">Follower</div><div class="big">'+(f!==null?num(f):'–')+'</div>'+
      (dl!==null?'<span class="chip '+(dl<0?'neg':'')+'">'+(dl>=0?'+':'')+num(dl)+' in 24 Std.</span>':'<span class="sub">'+(liveErr?esc(liveErr):'lädt…')+'</span>')+
      '<div style="margin-top:12px">'+spark(hist.map(function(x){return x.follower}),56)+'</div></div>'+
      '<div class="grid3"><div class="card"><div class="k">Views</div><div class="v">'+(live?cmp(live.views):'–')+'</div></div>'+
      '<div class="card"><div class="k">Likes</div><div class="v">'+(live?cmp(live.likes):'–')+'</div></div>'+
      '<div class="card"><div class="k">Videos</div><div class="v">'+(live?num(live.videos):'–')+'</div></div></div>'+
      pillsHTML()+rangeCard()+goalHTML()+
      '<div class="grid2"><div class="card"><div class="k">Dieser Monat</div><div class="v">'+eur(D.month)+'</div></div>'+
      '<div class="card"><div class="k">Gesamt</div><div class="v">'+eur(D.tot)+'</div></div></div>'+bestVideoHTML(S);
  }
  if(tab==='vid'){
    var L=live?live.list.filter(inR):[];
    if(sort==='top')L.sort(function(a,b){return b.views-a.views});else L.sort(function(a,b){return ms(b.created)-ms(a.created)});
    L=L.slice(0,60);var mx=Math.max.apply(null,L.map(function(v){return v.views}).concat([1]));
    h+=pillsHTML()+'<div class="pills"><button class="'+(sort==='top'?'on':'')+'" onclick="sort=\'top\';render()">🔥 Top</button><button class="'+(sort==='new'?'on':'')+'" onclick="sort=\'new\';render()">🕒 Neueste</button></div>'+
      '<div class="sub" style="margin:0 4px 8px">'+L.length+' Videos · tippe eins für den Check.</div><div class="card">'+(L.length?L.map(function(v,i){return '<div class="row" style="cursor:pointer" onclick="openV(\''+v.id+'\')"><div class="rank '+(i<3&&sort==='top'?'g':'')+'">'+(i+1)+'</div>'+img(v.cover)+'<div class="t"><div>'+esc(v.title||'(ohne Titel)')+'</div><small>'+num(v.likes)+' Likes'+(v.created?' · '+new Date(ms(v.created)).toLocaleDateString('de-DE'):'')+'</small><div class="vbar" style="width:'+Math.max(3,v.views/mx*100)+'%"></div></div><b>'+cmp(v.views)+'</b></div>'}).join(''):'<div class="empty">'+(liveErr?esc(liveErr):'Lädt…')+'</div>')+'</div>';
  }
  if(tab==='ins'){
    var DN=['So','Mo','Di','Mi','Do','Fr','Sa'],ord=[1,2,3,4,5,6,0],avg=ord.map(function(w){return {l:DN[w],v:S.dc[w]?S.dv[w]/S.dc[w]:0,n:S.dc[w],t:S.dc[w]?cmp(S.dv[w]/S.dc[w]):''}}),
        bi=-1,bv=0;avg.forEach(function(x,i){if(x.n>=2&&x.v>bv){bv=x.v;bi=i}});
    var hs=Object.keys(S.hc).filter(function(k){return S.hc[k]>=2}).map(function(k){return {h:+k,v:S.hv[k]/S.hc[k],n:S.hc[k]}}).sort(function(a,b){return b.v-a.v}).slice(0,3);
    h+=pillsHTML()+'<div class="sec">Wann posten?</div><div class="card"><div class="k">Ø Views pro Video je Wochentag</div><div style="margin-top:8px">'+bars(avg,bi<0?null:bi)+'</div>'+
      (bi>=0?'<div class="sub">Bester Tag: <b style="color:var(--tx)">'+avg[bi].l+'</b> (nur Tage mit mind. 2 Videos)</div>':'')+'</div>'+
      '<div class="card"><div class="k">🗓️ Heatmap: Wochentag × Uhrzeit</div><div style="margin-top:10px">'+heatmap(S)+'</div></div><div class="card"><div class="k">Beste Uhrzeiten</div>'+(hs.length?hs.map(function(x,i){return '<div class="row"><div class="rank '+(i===0?'g':'')+'">'+(i+1)+'</div><div class="t"><div>'+x.h+':00 – '+x.h+':59 Uhr</div><small>'+x.n+' Videos</small></div><b>'+cmp(x.v)+'</b></div>'}).join(''):'<div class="empty">Noch zu wenig Daten (mind. 2 Videos pro Stunde).</div>')+'</div>'+
      '<div class="sec">Verlauf</div><div class="card"><div class="k">Follower</div><div style="margin-top:6px">'+spark(hist.filter(function(x){return x.t>=cutoff()}).map(function(x){return x.follower}),80)+'</div></div>'+
      '<div class="card"><div class="k">Views gesamt</div><div style="margin-top:6px">'+spark(hist.filter(function(x){return x.t>=cutoff()}).map(function(x){return x.views}),80)+'</div></div>';
  }
  if(tab==='inc'){
    var tp=ls('ct_tax',0),months=[];
    for(var k=5;k>=0;k--){var d=new Date(D.now.getFullYear(),D.now.getMonth()-k,1),key=d.toISOString().slice(0,7),v=D.inc.filter(function(i){return i.date.slice(0,7)===key}).reduce(function(s,i){return s+i.amt},0);months.push({l:d.toLocaleDateString('de-DE',{month:'short'}),v:v,t:v?Math.round(v):''})}
    var per=live&&live.views&&D.tot?D.tot/live.views*1000:null;
    h+='<div class="card hero"><div class="k">Diesen Monat</div><div class="big">'+eur(D.month)+'</div><div class="sub">Gesamt '+eur(D.tot)+(per!==null?' · '+eur(per)+' pro 1.000 Views':'')+'</div></div>'+
      '<div class="card"><div class="k">Pro Monat</div><div style="margin-top:8px">'+bars(months)+'</div></div>'+
      (showForm?'<div class="card"><div class="k">Neue Einnahme</div><label>Betrag in €</label><input id="amt" inputmode="decimal" placeholder="z. B. 42,50">'+
        '<div class="grid2" style="margin:0"><div><label>Datum</label><input id="dt" type="date" value="'+today()+'"></div><div><label>Quelle</label><select id="src"><option>Creator Rewards</option><option>Live-Geschenke</option><option>Sponsoring</option><option>Affiliate</option><option>Sonstiges</option></select></div></div>'+
        '<label>Notiz (optional)</label><input id="nt"><button class="btn" onclick="addInc()">Speichern</button><button class="btn ghost" onclick="showForm=false;render()">Abbrechen</button></div>'
       :'<button class="btn" style="margin:0 0 12px" onclick="showForm=true;render()">+ Einnahme eintragen</button>')+
      '<div class="card"><div class="k">🧾 Steuerrücklage</div><label>Prozent</label><input type="number" min="0" max="60" value="'+tp+'" onchange="lsSet(\'ct_tax\',+this.value);render()">'+
        (tp?'<div class="sub" style="margin-top:8px">Zurücklegen: <b style="color:var(--tx)">'+eur(D.tot*tp/100)+'</b> · Übrig: '+eur(D.tot*(1-tp/100))+'</div>':'')+'</div>'+
      '<div class="sec">Verlauf</div><div class="card">'+(D.inc.length?D.inc.map(function(i){return '<div class="row"><div class="t"><div><b>'+eur(i.amt)+'</b></div><small>'+esc(i.src)+' · '+new Date(i.date).toLocaleDateString('de-DE')+(i.note?' · '+esc(i.note):'')+'</small></div><button class="x" onclick="del(\''+i.id+'\')">✕</button></div>'}).join(''):'<div class="empty">Noch keine Einnahmen.</div>')+'</div>';
  }
  var app=document.getElementById('app');app.innerHTML=h+sheetHTML();
}
function addInc(){
  var a=parseFloat(document.getElementById('amt').value.replace(',','.'));if(!(a>0))return;
  items.push({id:'e'+Date.now(),t:'inc',date:document.getElementById('dt').value||today(),amt:a,src:document.getElementById('src').value,note:document.getElementById('nt').value});
  save();showForm=false;render();
}
function del(id){items=items.filter(function(i){return i.id!==id});save();render()}
render();loadLive();
</script></body></html>
