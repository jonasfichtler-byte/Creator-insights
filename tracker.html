<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creator Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f5f5f8;--card:#fff;--tx:#14141a;--mu:#6b6b78;--ac:#fe2c55;--ok:#12a36b;--bd:#e3e3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e12;--card:#18181f;--tx:#f2f2f6;--mu:#9a9aa8;--bd:#2a2a34}}
:root[data-theme="dark"]{--bg:#0e0e12;--card:#18181f;--tx:#f2f2f6;--mu:#9a9aa8;--bd:#2a2a34}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:10px;font:inherit;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{color:var(--mu);font-size:13px}.v{font-size:24px;font-weight:700}
.pos{color:var(--ok)}.neg{color:var(--ac)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-top:4px}
label{font-size:13px;color:var(--mu);display:block}
.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row small{color:var(--mu)}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:4px 8px}
.note{color:var(--mu);font-size:13px}
svg{width:100%;height:auto;display:block}
</style></head><body><main>
<h1>📈 Creator Tracker</h1>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
<p class="note" id="foot"></p>
</main>
<script>
var tab='home',items=[],col=null,LS='ct_items',API='https://creator-tracker-api.jonas-fichtler.workers.dev',live=null,hist=[],liveErr='';
var eur=function(n){return n.toLocaleString('de-DE',{style:'currency',currency:'EUR'})};
var num=function(n){return Math.round(n).toLocaleString('de-DE')};
var today=function(){return new Date().toISOString().slice(0,10)};
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){}}
function taxPct(){try{return +localStorage.getItem('ct_tax')||0}catch(e){return 0}}
function goal(){try{return +localStorage.getItem('ct_goal')||0}catch(e){return 0}}
function setGoal(v){try{localStorage.setItem('ct_goal',v)}catch(e){}render()}
function goalCard(){
  var g=goal(),f=live?live.follower:null,h='<div class="card"><div class="k">Follower-Ziel</div>';
  if(!g||f===null)return h+'<label>Ziel (z. B. 20000)</label><input type="number" inputmode="numeric" placeholder="20000" onchange="setGoal(this.value)"></div>';
  var p=Math.min(100,f/g*100),rest=Math.max(0,g-f);
  h+='<div class="v">'+num(f)+' / '+num(g)+'</div><div style="height:10px;background:var(--bd);border-radius:6px;margin:8px 0;overflow:hidden"><div style="height:100%;width:'+p.toFixed(1)+'%;background:var(--ac)"></div></div>'+
     '<div class="k">'+p.toFixed(1)+' % · noch '+num(rest)+'</div>';
  if(rest===0)h+='<div class="k pos">Ziel erreicht! 🎉</div>';
  else if(hist.length>1){
    var a=hist[0],b=hist[hist.length-1],days=(b.t-a.t)/864e5,rate=days>0.2?(b.follower-a.follower)/days:0;
    h+=rate>0?'<div class="k">Ø +'+num(rate)+' pro Tag → ca. '+new Date(Date.now()+rest/rate*864e5).toLocaleDateString('de-DE')+' erreicht</div>':'<div class="k">Prognose folgt, sobald genug Verlauf da ist.</div>';
  } else h+='<div class="k">Prognose folgt, sobald genug Verlauf da ist.</div>';
  return h+'<label style="margin-top:8px">Ziel ändern</label><input type="number" inputmode="numeric" value="'+g+'" onchange="setGoal(this.value)"></div>';
}
function setTax(v){try{localStorage.setItem('ct_tax',v)}catch(e){}render()}

async function loadLive(){
  try{
    var r=await fetch(API+'/api/stats');var j=await r.json();
    if(j.error)throw new Error(j.error);live=j;liveErr='';
    var h=await fetch(API+'/api/history');hist=await h.json();
  }catch(e){liveErr=String(e.message||e).slice(0,120)}
  render();
}
setInterval(loadLive,60000);
async function init(){
  loadLive();
  items=lsLoad();render();
  document.getElementById('foot').textContent='Einnahmen werden nur in diesem Browser gespeichert.';
}
async function add(o){
  o.id='e'+Date.now();
  
  items.push(o);lsSave();render();
}
async function del(id){
  
  items=items.filter(function(i){return i.id!==id});lsSave();render();
}
function addIncome(){
  var a=parseFloat(document.getElementById('amt').value.replace(',','.'));
  if(!(a>0))return;
  add({t:'inc',date:document.getElementById('dt').value||today(),amt:a,src:document.getElementById('src').value,note:document.getElementById('nt').value});
}
function addSnap(){
  var f=parseInt(document.getElementById('fol').value),v=parseInt(document.getElementById('vw').value);
  if(isNaN(f))return;
  add({t:'snap',date:document.getElementById('dt2').value||today(),fol:f,vw:isNaN(v)?0:v});
}
function bars(d){
  var m=Math.max.apply(null,d.map(function(x){return x.v}).concat([1])),w=300/d.length,s='<svg viewBox="0 0 300 130">';
  d.forEach(function(x,i){var h=x.v/m*90;
    s+='<rect x="'+(i*w+6)+'" y="'+(100-h)+'" width="'+(w-12)+'" height="'+h+'" rx="4" fill="#fe2c55"/>'+
    '<text x="'+(i*w+w/2)+'" y="116" text-anchor="middle" font-size="10" fill="#8a8a98">'+x.l+'</text>'+
    '<text x="'+(i*w+w/2)+'" y="'+(94-h)+'" text-anchor="middle" font-size="9" fill="#8a8a98">'+(x.v?Math.round(x.v):'')+'</text>'});
  return s+'</svg>';
}
function line(p){
  if(p.length<2)return '<p class="note">Der Verlauf erscheint, sobald der Server 2 Messungen gespeichert hat (alle 30 Min.).</p>';
  var mn=Math.min.apply(null,p),mx=Math.max.apply(null,p),r=(mx-mn)||1,
  pts=p.map(function(v,i){return (10+i*280/(p.length-1)).toFixed(1)+','+(100-(v-mn)/r*85).toFixed(1)}).join(' ');
  return '<svg viewBox="0 0 300 110"><polyline points="'+pts+'" fill="none" stroke="#fe2c55" stroke-width="2.5" stroke-linejoin="round"/></svg>';
}
function render(){
  var T=[['home','Übersicht'],['inc','Einnahmen'],['reach','Reichweite']];
  document.getElementById('tabs').innerHTML=T.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join('');
  var inc=items.filter(function(i){return i.t==='inc'}).sort(function(a,b){return a.date<b.date?1:-1}),
      sn=items.filter(function(i){return i.t==='snap'}).sort(function(a,b){return a.date<b.date?-1:1}),
      now=new Date(),ym=now.toISOString().slice(0,7),
      mSum=inc.filter(function(i){return i.date.slice(0,7)===ym}).reduce(function(s,i){return s+i.amt},0),
      tot=inc.reduce(function(s,i){return s+i.amt},0),tp=taxPct(),
      last=live?{fol:live.follower,vw:live.views,likes:live.likes,videos:live.videos}:sn[sn.length-1],
      prev=hist.length>1?{fol:hist[Math.max(0,hist.length-49)].follower}:sn[sn.length-2],h='';
  var months=[];for(var k=5;k>=0;k--){var d=new Date(now.getFullYear(),now.getMonth()-k,1),key=d.toISOString().slice(0,7);
    months.push({l:d.toLocaleDateString('de-DE',{month:'short'}),v:inc.filter(function(i){return i.date.slice(0,7)===key}).reduce(function(s,i){return s+i.amt},0)})}
  var dl=last&&prev?last.fol-prev.fol:null;
  if(tab==='home'){
    h+='<div class="grid"><div class="card"><div class="k">Dieser Monat</div><div class="v">'+eur(mSum)+'</div></div>'+
       '<div class="card"><div class="k">Gesamt</div><div class="v">'+eur(tot)+'</div></div>'+
       '<div class="card"><div class="k">Follower</div><div class="v">'+(last?num(last.fol):'–')+'</div>'+(dl!==null?'<div class="k '+(dl>=0?'pos':'neg')+'">'+(dl>=0?'+':'')+num(dl)+' seit ca. 24 Std.</div>':'')+'</div>'+
       '<div class="card"><div class="k">Views gesamt</div><div class="v">'+(last?num(last.vw):'–')+'</div></div></div>'+
       goalCard()+'<div class="card"><div class="k">Einnahmen pro Monat (€)</div>'+bars(months)+'</div>'+
       '<p class="note">'+(live?'Live von TikTok · '+new Date(live.t).toLocaleTimeString('de-DE'):'Live-Daten: '+(liveErr||'lädt…'))+'</p>';
  }
  if(tab==='inc'){
    h+='<div class="card"><label>Betrag in €</label><input id="amt" inputmode="decimal" placeholder="z. B. 42,50">'+
       '<div class="grid"><div><label>Datum</label><input id="dt" type="date" value="'+today()+'"></div>'+
       '<div><label>Quelle</label><select id="src"><option>Creator Rewards</option><option>Live-Geschenke</option><option>Sponsoring</option><option>Affiliate</option><option>Sonstiges</option></select></div></div>'+
       '<label style="margin-top:8px">Notiz (optional)</label><input id="nt"><button class="btn" onclick="addIncome()">Einnahme speichern</button></div>'+
       '<div class="card"><label>Steuerrücklage in %</label><input type="number" min="0" max="60" value="'+tp+'" onchange="setTax(this.value)">'+
       (tp?'<p class="note">Von '+eur(tot)+' zurücklegen: <b>'+eur(tot*tp/100)+'</b> · Übrig: '+eur(tot*(1-tp/100))+'</p>':'')+'</div>'+
       '<div class="card">'+(inc.length?inc.map(function(i){return '<div class="row"><div>'+eur(i.amt)+'<br><small>'+esc(i.src)+' · '+new Date(i.date).toLocaleDateString('de-DE')+(i.note?' · '+esc(i.note):'')+'</small></div><button class="x" onclick="del(\''+i.id+'\')">✕</button></div>'}).join(''):'<p class="note">Noch keine Einnahmen.</p>')+'</div>';
  }
  if(tab==='reach'){
    var L=live?live.list.slice().sort(function(a,b){return b.views-a.views}).slice(0,15):[];
    h+='<div class="card"><div class="k">Follower-Verlauf</div>'+line(hist.map(function(x){return x.follower}))+'</div>'+
       '<div class="card"><div class="k">Views-Verlauf</div>'+line(hist.map(function(x){return x.views}))+'</div>'+
       '<div class="card"><div class="k">Top-Videos nach Views</div>'+(L.length?L.map(function(v){return '<div class="row"><div>'+esc(v.title||'(ohne Titel)')+'<br><small>'+num(v.likes)+' Likes</small></div><b>'+num(v.views)+'</b></div>'}).join(''):'<p class="note">'+(liveErr?esc(liveErr):'Lädt…')+'</p>')+'</div>';
  }
  document.getElementById('app').innerHTML=h;
}
init();
</script></body></html>
